name: Desktop conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      NODEBASED_SCREENSHOT: artifacts/desktop.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0
      - run: python -m pip install .
      - run: python tools/run_tests.py -v
      # Optional, non-blocking: the docs/BENCHMARKS-*-4k.md method, run on this CI runner so its
      # numbers trend over time. A shared runner is not a fixed workstation and is never a
      # release gate -- the label makes that explicit in the uploaded table.
      - name: 4K viewport benchmark (Windows CI runner, informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python tools/benchmark_4k_viewport.py --json artifacts/benchmark-4k-viewport.json --label "GitHub Actions windows-latest runner (not a workstation)"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: benchmark-4k-viewport-windows
          path: artifacts/benchmark-4k-viewport.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: artifacts/

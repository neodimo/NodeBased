name: Splat probe (temporary)
on:
  workflow_dispatch:
  push:
    branches: [fix/splat-d3d-1009]
    paths: ['.github/workflows/splat-probe.yml']
jobs:
  probe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[gpu,usd]"
      - run: python -X faulthandler -m unittest -v tests.test_3d_gpu_splat_layers tests.test_3d_gpu_splat_data tests.test_3d_light_linking_gpu tests.test_3d_mixed_scene_gate tests.test_3d_gpu_splat_shadows tests.test_sparse_gpu_volumes tests.test_sparse_light_links

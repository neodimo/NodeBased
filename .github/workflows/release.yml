name: Build release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages after all checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      NODEBASED_SCREENSHOT: artifacts/desktop.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux Qt and AppImage prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libfuse2 desktop-file-utils
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - run: python -m pip install . pyinstaller==6.19.0
      - run: python -m unittest discover -s tests -v
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from nodebased import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.os }}
          path: artifacts/
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release/
          merge-multiple: true
      - name: Read version
        id: version
        shell: python
        run: |
          import os, runpy
          version = runpy.run_path('nodebased/__init__.py')['__version__']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
      - name: Hash all packages
        working-directory: release
        run: sha256sum NodeBased-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodebased"
version = "0.24.0"
description = "An agent-ready, artist-first node compositing desktop workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=2.1,<3", "certifi>=2025.1", "OpenImageIO==3.1.17.0", "opencolorio==2.5.2", "pyte"]

[project.optional-dependencies]
gpu = ["wgpu>=0.32,<0.33"]
usd = ["usd-core>=26.8,<27"]

[project.scripts]
nodebased = "nodebased.app:main"
nodebased-agent = "nodebased.agent:main"
nodebased-agent-loop = "nodebased.agentloop:main"
nodebased-mcp = "nodebased.mcpserver:main"

[tool.setuptools.packages.find]
include = ["nodebased*"]

[tool.setuptools.package-data]
nodebased = ["data/docs/*.md"]
